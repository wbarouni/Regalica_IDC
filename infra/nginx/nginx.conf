worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote":"$remote_addr",'
      '"method":"$request_method",'
      '"path":"$request_uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"duration_ms":$request_time,'
      '"upstream":"$upstream_addr"'
    '}';
  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  upstream api_up      { server api:3000;          keepalive 16; }
  upstream chat_up     { server chatbot-node:3001; keepalive 16; }
  upstream frontend_up { server frontend:80;       keepalive 16; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # ---- API (Express + Sequelize) ----
    location /api/ {
      proxy_pass http://api_up/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 120s;
    }

    # ---- Chatbot gateway (Express + pg natif) ----
    location /chat/ {
      proxy_pass http://chat_up/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # ---- Socket.IO (websocket upgrade to API) ----
    location /ws/ {
      proxy_pass http://api_up/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }

    # ---- Frontend (Angular SPA served by internal nginx) ----
    location / {
      proxy_pass http://frontend_up;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
