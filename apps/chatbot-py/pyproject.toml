[project]
name = "regalica-chatbot-py"
version = "0.0.0"
description = "Regalica IDC — FastAPI chatbot avec agents LLM (Gemini/Ollama) et pipeline RAG"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ALGORIA Factory" }]
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "google-generativeai>=0.8.3",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF", "ANN"]
ignore = ["ANN401"]  # allow typing.Any in limited places

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
pythonpath = ["."]
