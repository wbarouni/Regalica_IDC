[project]
name = "regflow-seed-referentials-from-xml"
version = "1.0.0"
description = "Génère les migrations SQL de seeding des référentiels BCT depuis les XML golden"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "ALGORIA Factory", email = "dev@algoria.factory" },
]
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
regflow-seed-referentials = "seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
