name: CI

on:
  push:
    branches:
      [
        main,
        'v2-from-scratch',
        'phase-0/**',
        'phase-1/**',
        'phase-2/**',
        'phase-3/**',
        'phase-4/**',
        'phase-5/**',
        'phase-6/**',
        'feature/**',
        'fix/**',
      ]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  PNPM_VERSION: '10.33.0'

jobs:
  # =========================================================================
  # Lint & format (fail-fast)
  # =========================================================================
  lint-ts:
    name: Lint TS + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm -r --if-present lint

  lint-python:
    name: Lint Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/chatbot-py/uv.lock'
      - name: uv sync
        working-directory: apps/chatbot-py
        run: uv sync
      - name: ruff check
        working-directory: apps/chatbot-py
        run: uv run ruff check .
      - name: ruff format --check
        working-directory: apps/chatbot-py
        run: uv run ruff format --check .
      - name: mypy
        working-directory: apps/chatbot-py
        run: uv run mypy app

  # =========================================================================
  # Phase 0 guards (fail-fast)
  # =========================================================================
  forbidden-deps:
    name: Guard forbidden dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/check-forbidden-deps.sh
        run: bash tools/check-forbidden-deps.sh

  no-residual-debt:
    name: Guard no residual debt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/check-no-residual-debt.sh
        run: bash tools/check-no-residual-debt.sh

  no-bank-data:
    name: Guard no tenant-identifying data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/check-no-bank-data.sh
        run: bash tools/check-no-bank-data.sh

  no-hardcoding:
    name: Guard no hardcoding (applicative code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install semgrep
        run: pip install semgrep==1.161.0
      - name: Run tools/check-no-hardcoding.sh
        run: bash tools/check-no-hardcoding.sh

  # =========================================================================
  # Typecheck
  # =========================================================================
  typecheck-ts:
    name: Typecheck TS (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm -r --if-present typecheck

  # =========================================================================
  # Migration runner smoke (empty DB)
  # =========================================================================
  migrations-smoke:
    name: Migration runner smoke (empty DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regalica_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: regflow_migrations_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regalica_app -d regflow_migrations_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Smoke run migrator against empty DB
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://regalica_app:ci_password@localhost:5432/regflow_migrations_smoke
          API_CORS_ORIGIN: http://test.local
          PG_POOL_IDLE_TIMEOUT_MS: '1000'
          PG_POOL_CONN_TIMEOUT_MS: '5000'
          # Required by config.ts since commit C3 (H9). The migrate
          # CLI loads the same module as the route handlers, so the
          # full required-env block must be present even though
          # migrations themselves never see this value.
          REGFLOW_ENGINE_ROLE_CLAIM: regflow_engine
        run: |
          pnpm migrate:status
          pnpm migrate:up
          pnpm migrate:verify

  # =========================================================================
  # Unit tests
  # =========================================================================
  test-api:
    name: Test @regflow/api (Jest + pg)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regalica_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: regalica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regalica_app -d regalica_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Run @regflow/api tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://regalica_app:ci_password@localhost:5432/regalica_test
          NODE_ENV: test
          JWT_SECRET: test_secret_at_least_thirty_two_characters_long
          API_CORS_ORIGIN: http://test.local
          PG_POOL_IDLE_TIMEOUT_MS: '1000'
          PG_POOL_CONN_TIMEOUT_MS: '5000'
        run: pnpm test --coverage --runInBand

  test-chatbot-py:
    name: Test chatbot-py (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/chatbot-py/uv.lock'
      - working-directory: apps/chatbot-py
        run: uv sync
      - working-directory: apps/chatbot-py
        # Excludes GAUNTLET golden recette tests (run manually via
        # `uv run pytest -m gauntlet_golden`) — they assert ground truth
        # captured by the operator from BCT submissions and live in the
        # tenant-001 fixtures, not in the chatbot-py codebase.
        run: uv run pytest --cov=app --cov-report=term-missing -m "not gauntlet_golden"

  test-bct-xml-parser:
    name: Test @regflow/bct-xml-parser (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Run @regflow/bct-xml-parser tests
        working-directory: packages/bct-xml-parser
        run: pnpm test

  test-evaluator:
    name: Test @regflow/evaluator (golden — expected to fail until commit 9)
    runs-on: ubuntu-latest
    # Golden fixtures are produced by tools/golden-normalizer at commit 9.
    # Until then this suite cannot pass; continue-on-error keeps the
    # overall pipeline informative without masking the dependency.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install
      - name: Run @regflow/evaluator golden tests
        working-directory: packages/evaluator
        run: pnpm test

  # =========================================================================
  # Docker build smoke (one job per image, parallel)
  # =========================================================================
  build-images:
    name: Build Docker images (smoke)
    runs-on: ubuntu-latest
    needs: [lint-ts, typecheck-ts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: chatbot-py
            context: apps/chatbot-py
            dockerfile: apps/chatbot-py/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: regalica-idc/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
